<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6474"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>

  <text x="40" y="46" font-size="21" font-weight="600" fill="#12161f">robotic-arm — command to motion</text>
  <text x="40" y="70" font-size="13.5" fill="#6b7383">Language-conditioned agent calling scripted primitives in MuJoCo. Not a VLA: grasping uses weld constraints, object pose is simulator ground truth.</text>

  <!-- Input layer -->
  <rect x="40" y="100" width="180" height="62" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="130" y="126" font-size="14" font-weight="600" fill="#3730a3" text-anchor="middle">Microphone</text>
  <text x="130" y="146" font-size="11.5" fill="#4f46e5" text-anchor="middle">push-to-talk, 16 kHz mono</text>

  <rect x="250" y="100" width="200" height="62" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="350" y="126" font-size="14" font-weight="600" fill="#3730a3" text-anchor="middle">voice.py</text>
  <text x="350" y="146" font-size="11.5" fill="#4f46e5" text-anchor="middle">faster-whisper base.en, CPU int8</text>

  <rect x="480" y="100" width="180" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="570" y="126" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Typed command</text>
  <text x="570" y="146" font-size="11.5" fill="#64748b" text-anchor="middle">chat_ui.py / agent.py CLI</text>

  <line x1="220" y1="131" x2="244" y2="131" stroke="#5b6474" stroke-width="1.6"/>
  <polygon points="250,131 241,126 241,136" fill="#5b6474"/>

  <!-- Silence guard note -->
  <rect x="250" y="176" width="200" height="46" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="350" y="194" font-size="10.5" fill="#9a3412" text-anchor="middle">silence guard: drops sub-0.3 s,</text>
  <text x="350" y="210" font-size="10.5" fill="#9a3412" text-anchor="middle">low-confidence, hallucinated text</text>
  <line x1="350" y1="162" x2="350" y2="170" stroke="#9aa3b2" stroke-width="1.4"/>
  <polygon points="350,176 345,167 355,167" fill="#9aa3b2"/>

  <!-- Merge to text -->
  <line x1="350" y1="222" x2="350" y2="252" stroke="#5b6474" stroke-width="1.6"/>
  <line x1="570" y1="162" x2="570" y2="252" stroke="#5b6474" stroke-width="1.6"/>
  <line x1="350" y1="252" x2="570" y2="252" stroke="#5b6474" stroke-width="1.6"/>
  <line x1="460" y1="252" x2="460" y2="274" stroke="#5b6474" stroke-width="1.6"/>
  <polygon points="460,282 454,272 466,272" fill="#5b6474"/>
  <text x="474" y="269" font-size="11" fill="#6b7383">instruction text</text>

  <!-- Agent -->
  <rect x="180" y="284" width="560" height="118" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="200" y="308" font-size="14.5" font-weight="600" fill="#1e293b">agent.py — run_instruction()</text>

  <rect x="200" y="322" width="240" height="62" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="320" y="344" font-size="12.5" font-weight="600" fill="#065f46" text-anchor="middle">_local_plan() regex fast-path</text>
  <text x="320" y="363" font-size="11" fill="#047857" text-anchor="middle">common pick/place — no API call</text>

  <rect x="470" y="322" width="250" height="62" rx="7" fill="#fef2f2" stroke="#fecaca"/>
  <text x="595" y="344" font-size="12.5" font-weight="600" fill="#991b1b" text-anchor="middle">_nim_chat() tool-calling loop</text>
  <text x="595" y="363" font-size="11" fill="#b91c1c" text-anchor="middle">NVIDIA NIM gemma-4-31b-it</text>

  <text x="455" y="357" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">else</text>

  <!-- Tools -->
  <line x1="460" y1="402" x2="460" y2="430" stroke="#5b6474" stroke-width="1.6"/>
  <polygon points="460,438 454,428 466,428" fill="#5b6474"/>
  <text x="474" y="423" font-size="11" fill="#6b7383">pick · place · find_object · look_at_scene</text>

  <rect x="180" y="438" width="560" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="460" y="463" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="middle">skills.py — manipulation primitives</text>
  <text x="460" y="483" font-size="11.5" fill="#64748b" text-anchor="middle">differential IK via mink (DLS fallback) · weld-constraint grasp</text>

  <line x1="460" y1="498" x2="460" y2="526" stroke="#5b6474" stroke-width="1.6"/>
  <polygon points="460,534 454,524 466,524" fill="#5b6474"/>

  <rect x="180" y="534" width="560" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="460" y="559" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="middle">sim_env.py — MuJoCo physics + viewer</text>
  <text x="460" y="579" font-size="11.5" fill="#64748b" text-anchor="middle">Franka Panda · cameras front_34 and wrist_cam</text>

  <!-- Vision return path -->
  <path d="M 740 564 L 812 564 L 812 353 L 728 353" fill="none" stroke="#9aa3b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="720,353 730,348 730,358" fill="#9aa3b2"/>
  <text x="836" y="458" font-size="10.5" fill="#8b93a3" transform="rotate(-90 836 458)" text-anchor="middle">camera frames → look_at_scene</text>
</svg>
